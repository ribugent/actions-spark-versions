name: Mirroring release
run-name: Mirroring release ${{ inputs.version }}
concurrency:
  group: mirror-release-${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        type: string
        required: true

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Check existing tag
        run: |
          tag=$(git ls-remote --tags --refs origin "refs/tags/v$VERSION")
          if [ -z "$tag" ]; then
            echo "Version $VERSION is already mirrored"
            exit 1

      - name: Setup user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create release branch
        id: tag
        run: |
          git checkout --orphan "spark-$VERSION"
          git rm -rf .
          git commit --allow-empty -m "Spark release $VERSION"
          git push origin "spark-$VERSION"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Download release files
        run: |
          wget -e robots=off  -r -l 0 -np -nd -A "spark-*-bin-*" "https://dlcdn.apache.org/spark/spark-$VERSION/" || \
            wget -e robots=off  -r -l 0 -np -nd -A "spark-*-bin-*" "https://archive.apache.org/dist/spark/spark-$VERSION/"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          target_commitish: ${{ steps.tag.outputs.commit }}
          files: spark-*-bin-*
          name: Spark ${{ inputs.version }}
          fail_on_unmatched_files: true

      - name: Cleanup branch
        if: always()
        run: |
          git push origin --delete "spark-$VERSION" || true

      - name: Cleanup tag on failure
        if: failure()
        run: |
          git push origin --delete "v$VERSION" || true
